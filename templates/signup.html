<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Me – Create Account 🎭</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-box">
        <div class="auth-icon">🎭</div>
        <h1>Meme Me</h1>
        <h2>Create your account</h2>

        <div id="auth-error" class="auth-error hidden"></div>

        <div class="auth-field">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
        </div>

        <div class="auth-field">
            <label>Password</label>
            <span class="input-wrapper">
                <input type="password" id="password" placeholder="Create a password"
                    autocomplete="new-password" oninput="checkPwCriteria()" />
                <span class="toggle-icon">😎</span>
            </span>
        </div>

        <!-- Live criteria checker -->
        <div class="pw-criteria">
            <div class="pw-criteria-title">Password Criteria</div>
            <div class="crit" id="crit-len">At least 8 characters</div>
            <div class="crit" id="crit-upper">At least one uppercase letter (A–Z)</div>
            <div class="crit" id="crit-num">At least one number (0–9)</div>
        </div>

        <div class="auth-field">
            <label>Confirm Password</label>
            <span class="input-wrapper">
                <input type="password" id="confirm-password" placeholder="Confirm your password"
                       autocomplete="new-password"
                       onkeydown="if(event.key==='Enter') handleSignup()" />
                <span class="toggle-icon">😎</span>
            </span>
        </div>

        <button class="auth-btn" onclick="handleSignup()">Create Account</button>

        <p class="auth-switch">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>

    <footer> Made with joy from Particularly Kool Joy Coders Team 😎 </footer>


    <!-- Scripts for Firebase, app logic, and firebase -->
     
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/static/js/firebase-config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/script.js"></script>

    <script>
        function checkPwCriteria() {
            const pw = document.getElementById('password').value;
            document.getElementById('crit-len').className   = 'crit' + (pw.length >= 8       ? ' met' : '');
            document.getElementById('crit-upper').className = 'crit' + (/[A-Z]/.test(pw)     ? ' met' : '');
            document.getElementById('crit-num').className   = 'crit' + (/[0-9]/.test(pw)     ? ' met' : '');
        }
    </script>
</body>
</html>

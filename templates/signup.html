<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Me – Create Account 🎭</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%; width: 100%;
            overflow: hidden;
            background: #12102a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(106,53,216,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(245,166,35,0.12) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-box {
            position: relative;
            background: #6a35d8;
            border-radius: 20px;
            padding: 28px 36px 24px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
            display: flex; flex-direction: column; gap: 12px;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-icon { font-size: 2.2rem; text-align: center; }

        .auth-box h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.9rem; font-weight: 400;
            color: #fff; text-align: center;
        }

        .auth-box h2 {
            font-size: 0.95rem; color: rgba(255,255,255,0.7);
            text-align: center; margin-top: -6px; font-weight: 600;
        }

        .auth-field { display: flex; flex-direction: column; gap: 5px; }

        .auth-field label {
            font-size: 0.72rem; font-weight: 800;
            color: #f5a623; text-transform: uppercase; letter-spacing: 0.8px;
        }

        .auth-field input {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.13);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: #fff;
            font-size: 0.95rem; font-family: 'Nunito', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .auth-field input::placeholder { color: rgba(255,255,255,0.38); }
        .auth-field input:focus { border-color: #f5a623; background: rgba(255,255,255,0.18); }

        /* ── LIVE PASSWORD CRITERIA ── */
        .pw-criteria {
            background: rgba(0,0,0,0.22);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .pw-criteria-title {
            font-size: 0.7rem; font-weight: 800; color: #f5a623;
            text-transform: uppercase; letter-spacing: 0.8px;
            margin-bottom: 2px;
        }
        .crit {
            font-size: 0.78rem; font-weight: 700;
            color: rgba(255,255,255,0.45);
            display: flex; align-items: center; gap: 6px;
            transition: color 0.25s;
        }
        .crit::before { content: '✗'; font-size: 0.8rem; color: #ff7777; transition: color 0.25s; }
        .crit.met { color: rgba(255,255,255,0.85); }
        .crit.met::before { content: '✓'; color: #7fff7f; }

        /* ── BUTTONS ── */
        .auth-btn {
            width: 100%; padding: 11px;
            background: #fff; color: #6a35d8;
            font-family: 'Nunito', sans-serif;
            font-weight: 800; font-size: 1rem;
            border: none; border-radius: 12px; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            margin-top: 2px;
        }
        .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .auth-btn:active { transform: translateY(0); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ── ERROR ── */
        .auth-error {
            background: rgba(255,80,80,0.18);
            border: 1.5px solid rgba(255,80,80,0.4);
            color: #ffb3b3; border-radius: 10px;
            padding: 9px 14px; font-size: 0.85rem;
            text-align: center; font-weight: 600;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }
        .hidden { display: none; }

        .auth-switch {
            text-align: center; color: rgba(255,255,255,0.65);
            font-size: 0.85rem; font-weight: 600;
        }
        .auth-switch a { color: #f5a623; font-weight: 800; text-decoration: none; }
        .auth-switch a:hover { opacity: 0.8; }

        footer {
            margin-top: 16px; font-size: 0.75rem;
            color: rgba(255,255,255,0.3); text-align: center; font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-box">
        <div class="auth-icon">🎭</div>
        <h1>Meme Me</h1>
        <h2>Create your account</h2>

        <div id="auth-error" class="auth-error hidden"></div>

        <div class="auth-field">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
        </div>

        <div class="auth-field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password"
                   autocomplete="new-password" oninput="checkPwCriteria()" />
        </div>

        <!-- Live criteria checker -->
        <div class="pw-criteria">
            <div class="pw-criteria-title">Password Criteria</div>
            <div class="crit" id="crit-len">At least 8 characters</div>
            <div class="crit" id="crit-upper">At least one uppercase letter (A–Z)</div>
            <div class="crit" id="crit-num">At least one number (0–9)</div>
        </div>

        <div class="auth-field">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password"
                   autocomplete="new-password"
                   onkeydown="if(event.key==='Enter') handleSignup()" />
        </div>

        <button class="auth-btn" onclick="handleSignup()">Create Account</button>

        <p class="auth-switch">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>

    <footer>Made with joy from Particularly Kool Joy Coders Team 😎</footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/static/js/firebase-config.js"></script>
    <script src="/static/js/auth.js"></script>

    <script>
        function checkPwCriteria() {
            const pw = document.getElementById('password').value;
            document.getElementById('crit-len').className   = 'crit' + (pw.length >= 8       ? ' met' : '');
            document.getElementById('crit-upper').className = 'crit' + (/[A-Z]/.test(pw)     ? ' met' : '');
            document.getElementById('crit-num').className   = 'crit' + (/[0-9]/.test(pw)     ? ' met' : '');
        }
    </script>
</body>
</html>

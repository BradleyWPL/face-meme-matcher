<!--
=============================================================================
FILE: login.html
PROJECT: Face Meme Matcher — Meme Me
=============================================================================
DESCRIPTION:
  Login page. Collects user email and password, authenticates via Firebase
  Auth through auth.js, and provides navigation to the signup page.

IPO BREAKDOWN:
  INPUT:
    User-entered email and password in form fields
    Firebase Auth via auth.js login() function
    sessionStorage for bypass login detection

  PROCESSING:
    Renders email input, password input, and Login button
    Calls auth.js login() on submit — handles Firebase signIn and bypass
    Renders Create an Account link navigating to /signup
    Displays inline error messages for invalid credentials
    Loads auth.css for page-specific styles

  OUTPUT:
    Authenticated session stored, redirect to /meme-me on success
    Error message displayed on invalid login attempt
    Navigation to /signup for new users
=============================================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Me – Login 🎭</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-box">
        <div class="auth-icon">🎭</div>
        <h1>Meme Me</h1>
        <h2>Login to your account</h2>

        <div id="auth-error" class="auth-error hidden"></div>

        <div class="auth-field">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
        </div>

        <div class="auth-field">
            <label>Password</label>
                <span class="input-wrapper">
                
                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password"
                        onkeydown="if(event.key==='Enter') handleLogin()" />
                 <span class="toggle-icon">😎</span>
            </span>
        </div>

        <button class="auth-btn" onclick="handleLogin()">Login</button>


        <p class="auth-switch">
            Don't have an account? <a href="/signup">Create Account</a>
        </p>
    </div>

    <footer>Made with joy from Particularly Kool Joy Coders Team 😎</footer>

    <!-- Scripts for Firebase, app logic, and firebase -->

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/static/js/firebase-config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/script.js"></script>

</body>
</html>

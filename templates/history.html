<!--
=============================================================================
FILE: history.html
PROJECT: Face Meme Matcher — Meme Me
=============================================================================
DESCRIPTION:
  Meme history gallery page. Displays all saved meme snapshots for the
  logged-in user. Loads history.js which queries Firestore and dynamically
  renders image cards.

IPO BREAKDOWN:
  INPUT:
    Authenticated Firebase user session
    Firestore memeHistory collection for the current user
    history.js loadHistory() function called on page load

  PROCESSING:
    Renders sticky header with brand, user email, Back, and Logout buttons
    Renders #history-grid div populated dynamically by history.js
    Loads firebase-config.js, auth.js, history.js scripts in order
    history.js fetches Firestore docs and builds history-card elements
    Shows loading state until Firestore query resolves

  OUTPUT:
    Grid of meme history cards with image, meme name, and save date
    Empty state message if no memes saved
    Error message if Firestore query fails
    Back button navigates to /meme-me
    Logout clears session and redirects to /login
=============================================================================
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme History — Meme Me 🎭</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/history.css') }}">
    
</head>
<body>

    <div class="history-header">
        <div class="header-brand">🎭 Meme Me</div>
        <div class="header-right">
            <span id="user-email-display" style="margin-right: 15px; font-weight: bold;"></span>
            <button class="nav-btn" onclick="goBack()">← Back</button>
            <button class="nav-btn logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="history-wrapper">
        <h2 class="history-title">Your Meme History</h2>
        <p class="history-subtitle">All your saved meme matches, newest first</p>

        <div id="history-grid">
            <div class="state-msg">
                <span>⏳</span>
                Loading your memes…
            </div>
        </div>

        <footer>Made with joy from Particularly Kool Joy Coders Team 😎</footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="/static/js/firebase-config.js"></script>
    <script src="/static/js/history.js"></script>
    <script src="/static/js/firebase-config.js"></script>
    <script src="../static/js/auth.js"></script>
    <script src="../static/js/history.js"></script>
    <script src="/static/js/script.js"></script>

    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/meme-me';
            }
        }
    </script>
</body>
</html>
